{% extends "layout.html" %}

{% block content %}

<h2>Checkout 💳</h2>

<div id="checkout-items"></div>

<h3 id="total-amount"></h3>

<h4>Order Confirmation</h4>

<p>
    Online payment is not available yet.
    Placing an order does not charge your card or collect payment.
</p>

<br><br>

<button id="place-order-btn" onclick="handleCheckout()" disabled>Place Order ✅</button>

<script>
const params = new URLSearchParams(window.location.search);
const productId = params.get("product_id");

let total = 0;
let selectedOrderIds = [];
let buyNowOrderId = null;
let buyNowProductReady = false;
let buyNowCreationUncertain = false;
let buyNowCreationPromise = null;

// ================= LOAD CHECKOUT =================
async function loadCheckout() {

    const container = document.getElementById("checkout-items");
    container.innerHTML = "";
    total = 0;
    selectedOrderIds = [];
    buyNowProductReady = false;
    document.getElementById("place-order-btn").disabled = true;

    // ================= BUY NOW =================
    if (productId) {
        console.log("🔥 Buy Now Flow");

        const token = localStorage.getItem("access");

        if (!token) {
            container.textContent =
                "Please log in before proceeding to checkout.";
            return;
        }

        const id = Number(productId);

        if (!Number.isSafeInteger(id) || id <= 0) {
            container.textContent = "Invalid product selected.";
            return;
        }

        let product;

        try {
            const res = await fetch(`${PRODUCT_URL}/api/products/${id}/`);

            if (!res.ok) {
                container.textContent =
                    "Unable to load this product. Please try again.";
                return;
            }

            product = await res.json();

        } catch (error) {
            console.error("Buy Now product loading failed:", error);
            container.textContent =
                "Unable to load this product. Please try again.";
            return;
        }

        if (
            !product ||
            typeof product !== "object" ||
            Array.isArray(product)
        ) {
            container.textContent = "Invalid product information.";
            return;
        }

        const price = Number(product.price);

        if (
            product.price === null ||
            product.price === undefined ||
            !Number.isFinite(price) ||
            price < 0 ||
            typeof product.name !== "string" ||
            !product.name.trim()
        ) {
            container.textContent = "Invalid product information.";
            return;
        }

        total = price;
        buyNowProductReady = true;

        container.innerHTML = `
            <h3>${product.name}</h3>
            <img src="${product.image_url}" width="200"/>
            <p>${product.description}</p>
            <p><b>€${product.price}</b></p>
        `;
    }

    // ================= CART FLOW =================
    else {
        console.log("🔥 Cart Checkout Flow");

        const token = localStorage.getItem("access");

        if (!token) {
            container.textContent = "Please log in to view your cart.";
            return;
        }

        const cartRes = await fetch(`${ORDER_URL}/api/cart/`, {
            headers: authHeaders()
        });

        if (!cartRes.ok) {
            container.textContent =
                cartRes.status === 401
                    ? "Your session has expired. Please log in again."
                    : "Unable to load your cart. Please try again.";
            return;
        }

        const cartItems = await cartRes.json();

        if (!Array.isArray(cartItems)) {
            container.textContent = "Unexpected cart response.";
            return;
        }

        if (cartItems.length === 0) {
            container.textContent = "Your cart is empty.";
            document.getElementById("total-amount").textContent = "Total: €0.00";
            return;
        }

        // Read the selection saved by the cart page.
        const storedSelection = sessionStorage.getItem("checkoutSelectedItems");

        let requestedIds;

        try {
            requestedIds = JSON.parse(storedSelection);
        } catch (error) {
            requestedIds = null;
        }

        if (
            !Array.isArray(requestedIds) ||
            requestedIds.length === 0 ||
            requestedIds.some(id => !Number.isSafeInteger(id) || id <= 0)
        ) {
            container.textContent =
                "No valid cart selection found. Please return to your cart.";
            return;
        }

        // Only retain selected IDs belonging to the authenticated cart.
        const cartIds = new Set(cartItems.map(item => item.id));

        if (requestedIds.some(id => !cartIds.has(id))) {
            container.textContent =
                "Your cart has changed. Please return to your cart and select items again.";
            return;
        }

        selectedOrderIds = [...new Set(requestedIds)];

        const selectedCartItems = cartItems.filter(
            item => selectedOrderIds.includes(item.id)
        );

        for (let item of selectedCartItems) {

            const productRes = await fetch(`${PRODUCT_URL}/api/products/${item.product_id}/`);
            const product = await productRes.json();

            total += product.price * item.quantity;

            container.innerHTML += `
                <div>
                    <h3>${product.name}</h3>
                    <img src="${product.image_url}" width="150"/>
                    <p>${product.description}</p>
                    <p><b>€${product.price}</b></p>
                    <p>Qty: ${item.quantity}</p>
                </div>
                <hr>
            `;
        }
    }

    document.getElementById("total-amount").innerText =
        "Total: €" + total;

    if (selectedOrderIds.length > 0) {
        document.getElementById("place-order-btn").disabled = false;
    }
}

// ================= BUY NOW IDEMPOTENCY =================
// Keep one key for the current user, product, and checkout attempt.
// This helper is not connected to order submission yet.
function prepareBuyNowIdempotencyKey(userId, selectedProductId) {
    const user = Number(userId);
    const product = Number(selectedProductId);

    if (
        !Number.isSafeInteger(user) || user <= 0 ||
        !Number.isSafeInteger(product) || product <= 0
    ) {
        throw new Error("Invalid Buy Now checkout identity.");
    }

    if (
        typeof sessionStorage === "undefined" ||
        typeof sessionStorage.getItem !== "function" ||
        typeof sessionStorage.setItem !== "function"
    ) {
        throw new Error("Secure checkout storage is unavailable.");
    }

    if (
        typeof crypto === "undefined" ||
        typeof crypto.randomUUID !== "function"
    ) {
        throw new Error("Secure checkout key generation is unavailable.");
    }

    const storageKey = "buyNowIdempotencyAttempt";
    const existing = sessionStorage.getItem(storageKey);

    if (existing !== null) {
        let attempt;

        try {
            attempt = JSON.parse(existing);
        } catch (error) {
            throw new Error("Stored checkout attempt is invalid.");
        }

        if (
            !attempt ||
            attempt.userId !== user ||
            attempt.productId !== product ||
            typeof attempt.key !== "string" ||
            !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(attempt.key)
        ) {
            throw new Error(
                "A different or invalid checkout attempt is already stored."
            );
        }

        return attempt.key;
    }

    const key = crypto.randomUUID();

    if (
        typeof key !== "string" ||
        !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(key)
    ) {
        throw new Error("Unable to generate a valid checkout key.");
    }

    sessionStorage.setItem(
        storageKey,
        JSON.stringify({
            userId: user,
            productId: product,
            key
        })
    );

    return key;
}

// ================= COMPLETE BUY NOW ATTEMPT =================
// Call only after successful checkout has been confirmed.
// Never clear an attempt because of a network error or uncertain outcome.
function completeBuyNowCheckoutAttempt(userId, selectedProductId) {
    const user = Number(userId);
    const product = Number(selectedProductId);

    if (
        !Number.isSafeInteger(user) || user <= 0 ||
        !Number.isSafeInteger(product) || product <= 0
    ) {
        throw new Error("Invalid Buy Now checkout identity.");
    }

    if (
        typeof sessionStorage === "undefined" ||
        typeof sessionStorage.getItem !== "function" ||
        typeof sessionStorage.removeItem !== "function"
    ) {
        throw new Error("Secure checkout storage is unavailable.");
    }

    const storageKey = "buyNowIdempotencyAttempt";
    const existing = sessionStorage.getItem(storageKey);

    if (existing === null) {
        throw new Error("No checkout attempt is stored.");
    }

    let attempt;

    try {
        attempt = JSON.parse(existing);
    } catch (error) {
        throw new Error("Stored checkout attempt is invalid.");
    }

    if (
        !attempt ||
        attempt.userId !== user ||
        attempt.productId !== product ||
        typeof attempt.key !== "string" ||
        !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(attempt.key)
    ) {
        throw new Error(
            "Cannot complete a different checkout attempt."
        );
    }

    sessionStorage.removeItem(storageKey);
}

// ================= BUY NOW ORDER CREATION =================
function createBuyNowOrder() {
    if (buyNowCreationPromise !== null) {
        return buyNowCreationPromise;
    }

    const operation = performBuyNowOrderCreation();

    buyNowCreationPromise = operation;

    // Clear the in-flight reference when the operation settles.
    // The existing order ID and uncertainty checks remain authoritative.
    void operation.then(
        () => {
            if (buyNowCreationPromise === operation) {
                buyNowCreationPromise = null;
            }
        },
        () => {
            if (buyNowCreationPromise === operation) {
                buyNowCreationPromise = null;
            }
        }
    );

    return operation;
}

async function performBuyNowOrderCreation() {
    const id = Number(productId);

    if (!Number.isSafeInteger(id) || id <= 0) {
        throw new Error("Invalid Buy Now product ID.");
    }

    if (!buyNowProductReady) {
        throw new Error("Buy Now product information is not ready.");
    }

    if (buyNowCreationUncertain) {
        throw new Error(
            "The previous order-creation outcome is uncertain."
        );
    }

    // Reuse a successfully created order rather than creating another.
    if (buyNowOrderId !== null) {
        return buyNowOrderId;
    }

    const token = localStorage.getItem("access");

    if (!token) {
        throw new Error("Please log in before placing an order.");
    }

    // Prepare the idempotency key before sending an order request.
    // Reuse the same key for this user, product, and checkout attempt.
    let user;

    try {
        user = JSON.parse(localStorage.getItem("user") || "null");
    } catch (error) {
        throw new Error("Invalid user session. Please log in again.");
    }

    if (!user || !Number.isSafeInteger(Number(user.id)) ||
        Number(user.id) <= 0) {
        throw new Error("Invalid user session. Please log in again.");
    }

    const idempotencyKey = prepareBuyNowIdempotencyKey(user.id, id);

    // Record that an order request may reach the server.
    // This state survives a page refresh.
    const storageKey = "buyNowIdempotencyAttempt";
    const storedAttempt = JSON.parse(sessionStorage.getItem(storageKey));

    if (
        !storedAttempt ||
        storedAttempt.userId !== Number(user.id) ||
        storedAttempt.productId !== id ||
        storedAttempt.key !== idempotencyKey
    ) {
        throw new Error(
            "A previous Buy Now attempt must be resolved before retrying."
        );
    }

    // A confirmed order may be restored after a page refresh.
    // Do not send another POST or clear the idempotency key.
    if (storedAttempt.state === "confirmed") {
        if (
            !Number.isSafeInteger(storedAttempt.orderId) ||
            storedAttempt.orderId <= 0
        ) {
            throw new Error(
                "The stored confirmed Buy Now order ID is invalid."
            );
        }

        buyNowOrderId = storedAttempt.orderId;
        return buyNowOrderId;
    }

    // An unresolved request must never be submitted again automatically.
    if (
        storedAttempt.state !== undefined &&
        storedAttempt.state !== "prepared"
    ) {
        throw new Error(
            "A previous Buy Now attempt must be resolved before retrying."
        );
    }

    sessionStorage.setItem(
        storageKey,
        JSON.stringify({
            ...storedAttempt,
            state: "pending"
        })
    );

    // Verify the pending record before sending an order request.
    // A missing record could allow a duplicate order after refresh.
    let persistedAttempt;

    try {
        persistedAttempt = JSON.parse(
            sessionStorage.getItem(storageKey)
        );
    } catch (error) {
        throw new Error(
            "Unable to verify the pending Buy Now checkout attempt."
        );
    }

    if (
        !persistedAttempt ||
        persistedAttempt.userId !== Number(user.id) ||
        persistedAttempt.productId !== id ||
        persistedAttempt.key !== idempotencyKey ||
        persistedAttempt.state !== "pending"
    ) {
        throw new Error(
            "Unable to verify the pending Buy Now checkout attempt."
        );
    }

    let response;

    try {
        response = await fetch(`${ORDER_URL}/api/orders/`, {
            method: "POST",
            headers: {
                ...authHeaders(),
                "Idempotency-Key": idempotencyKey
            },
            body: JSON.stringify({
                product_id: id,
                quantity: 1
            })
        });
    } catch (error) {
        // The server may have created the order before the connection failed.
        buyNowCreationUncertain = true;
        throw new Error(
            "Unable to confirm whether the Buy Now order was created."
        );
    }

    if (!response.ok) {
        if (response.status >= 500 || !Number.isInteger(response.status)) {
            buyNowCreationUncertain = true;
            throw new Error(
                "Unable to confirm whether the Buy Now order was created."
            );
        }

        throw new Error(
            "Unable to create the Buy Now order."
        );
    }

    let data;

    try {
        data = await response.json();
    } catch (error) {
        buyNowCreationUncertain = true;
        throw new Error(
            "Unable to confirm the created Buy Now order ID."
        );
    }

    if (
        !data ||
        !Number.isSafeInteger(data.order_id) ||
        data.order_id <= 0
    ) {
        buyNowCreationUncertain = true;
        throw new Error(
            "Invalid Buy Now order ID returned by the server."
        );
    }

    // Persist the confirmed order before relying on in-memory state.
    // Order creation is confirmed, but checkout is not yet completed.
    let confirmationAttempt;

    try {
        confirmationAttempt = JSON.parse(
            sessionStorage.getItem(storageKey)
        );
    } catch (error) {
        buyNowCreationUncertain = true;
        throw new Error(
            "Unable to verify the stored Buy Now checkout attempt."
        );
    }

    if (
        !confirmationAttempt ||
        confirmationAttempt.userId !== Number(user.id) ||
        confirmationAttempt.productId !== id ||
        confirmationAttempt.key !== idempotencyKey ||
        confirmationAttempt.state !== "pending"
    ) {
        buyNowCreationUncertain = true;
        throw new Error(
            "The stored Buy Now checkout attempt has changed."
        );
    }

    try {
        sessionStorage.setItem(
            storageKey,
            JSON.stringify({
                ...confirmationAttempt,
                state: "confirmed",
                orderId: data.order_id
            })
        );
    } catch (error) {
        buyNowCreationUncertain = true;
        throw new Error(
            "Unable to save the confirmed Buy Now order."
        );
    }

    // Confirm that the order ID was actually saved before reporting success.
    // A storage write can silently fail without throwing an exception.
    let persistedConfirmation;

    try {
        persistedConfirmation = JSON.parse(
            sessionStorage.getItem(storageKey)
        );
    } catch (error) {
        buyNowCreationUncertain = true;
        throw new Error(
            "Unable to verify the confirmed Buy Now order."
        );
    }

    if (
        !persistedConfirmation ||
        persistedConfirmation.userId !== Number(user.id) ||
        persistedConfirmation.productId !== id ||
        persistedConfirmation.key !== idempotencyKey ||
        persistedConfirmation.state !== "confirmed" ||
        persistedConfirmation.orderId !== data.order_id
    ) {
        buyNowCreationUncertain = true;
        throw new Error(
            "Unable to verify the confirmed Buy Now order."
        );
    }

    buyNowOrderId = data.order_id;
    return buyNowOrderId;
}

// ================= HANDLE CHECKOUT =================
async function handleCheckout() {
    const button = document.getElementById("place-order-btn");
    const token = localStorage.getItem("access");

    if (!token) {
        alert("Please log in before placing an order.");
        return;
    }

    const user = JSON.parse(localStorage.getItem("user") || "null");

    if (!user || !Number.isSafeInteger(Number(user.id)) || Number(user.id) <= 0) {
        alert("Invalid user session. Please log in again.");
        return;
    }

    if (
        !productId &&
        (
            selectedOrderIds.length === 0 ||
            selectedOrderIds.some(
                id => !Number.isSafeInteger(id) || id <= 0
            )
        )
    ) {
        alert("No valid items selected for checkout.");
        return;
    }

    if (button.disabled) {
        return;
    }

    // Buy Now requires a validated product preview.
    if (productId) {
        if (buyNowCreationUncertain) {
            alert(
                "Unable to confirm whether an order was created. " +
                "Please check your cart and order history before trying again."
            );
            return;
        }

        if (!buyNowProductReady) {
            alert("Product information is not ready. Please try again.");
            return;
        }

        // Order creation will be implemented and tested separately.
        alert("Buy Now checkout is not yet available.");
        return;
    }

    button.disabled = true;
    let checkoutSucceeded = false;
    let checkoutOutcomeUncertain = false;

    try {
        const response = await fetch(`${ORDER_URL}/api/checkout/${user.id}/`, {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({
                items: selectedOrderIds
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Unable to place your order.");
            return;
        }

        checkoutSucceeded = true;
        sessionStorage.removeItem("checkoutSelectedItems");

        alert(data.message || "Order placed successfully.");
        window.location.href = "/orders/";

    } catch (error) {
        checkoutOutcomeUncertain = true;
        console.error("Checkout error:", error);
        alert(
            "Unable to confirm your order. Please check your order history before trying again."
        );
    } finally {
        if (!checkoutSucceeded && !checkoutOutcomeUncertain) {
            button.disabled = false;
        }
    }
}

document.addEventListener("DOMContentLoaded", loadCheckout);

</script>

{% endblock %}
