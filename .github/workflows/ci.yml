name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            working_dir: auth-service
            settings_module: auth_service.settings
            app_dir: auth_service
          - service: order-service
            working_dir: order-service
            settings_module: order_service.settings
            app_dir: .
          - service: product-service
            working_dir: product-service
            settings_module: product_service.settings
            app_dir: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.working_dir }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.working_dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pylint
        working-directory: ${{ matrix.working_dir }}
        env:
          SECRET_KEY: dummy-ci-secret-key-not-used-in-production
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          JWT_SIGNING_KEY: dummy-ci-jwt-key-not-used-in-production
          DB_NAME: dummy_db
          DB_USER: dummy_user
          DB_PASSWORD: dummy_pass
          DB_HOST: localhost
          DB_PORT: '5432'
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: '5672'
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
        run: |
          pylint --exit-zero --fail-under=6.0 $(find . -name "*.py" ! -path "*/migrations/*" ! -path "*/venv/*" ! -path "*/.venv/*" ! -name "manage.py" ! -path "*/tests/*")

      - name: Run pytest with coverage
        working-directory: ${{ matrix.working_dir }}
        env:
          SECRET_KEY: dummy-ci-secret-key-not-used-in-production
          DEBUG: 'False'
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          JWT_SIGNING_KEY: dummy-ci-jwt-key-not-used-in-production
          DB_NAME: dummy_db
          DB_USER: dummy_user
          DB_PASSWORD: dummy_pass
          DB_HOST: localhost
          DB_PORT: '5432'
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: '5672'
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
        run: |
          python -m pytest tests/ -v --no-header

  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [auth-service, order-service, product-service, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/furniture-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/furniture-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max