# version: '3.9'

services:

  auth-service:
    build: ./auth-service
    container_name: auth-service
    env_file:
      - ./auth-service/.env
    volumes:
      - auth_db:/app/data
    networks:
      - microservices-network
    restart: unless-stopped

  product-service:
    build: ./product-service
    container_name: product-service
    env_file:
      - ./product-service/.env
    networks:
      - microservices-network
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    env_file:
      - ./order-service/.env
    networks:
      - microservices-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - microservices-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - product-service
      - order-service
    networks:
      - microservices-network
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge

volumes:
  auth_db: